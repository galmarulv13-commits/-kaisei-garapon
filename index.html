<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>凱政ガラポン</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff3c8;color:#282828;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:680px;margin:auto;padding:18px 14px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:clamp(28px,8vw,42px);margin:0}.top{display:flex;gap:8px;align-items:center}.pill,.gear{background:#fff;border:3px solid #282828;box-shadow:0 4px #0002}
.pill{border-radius:99px;padding:8px 12px;white-space:nowrap}.gear{width:50px;height:50px;border-radius:50%;font-size:24px}
.machine,.book{background:#fffdf7;border:4px solid #282828;border-radius:28px;box-shadow:0 8px #0002}.machine{margin-top:18px;padding:18px;text-align:center}
.hero{height:min(78vw,390px);display:flex;align-items:center;justify-content:center}.hero img{width:100%;height:100%;object-fit:contain;border-radius:18px}
.q{font-size:140px;font-weight:900}.name{font-size:clamp(27px,8vw,40px);font-weight:900;min-height:52px}.meta{min-height:64px}
.tag{display:inline-block;border:2px solid #333;border-radius:99px;padding:4px 8px;margin:3px;font-weight:800;font-size:13px}.new{background:#f25560;color:#fff}
.spin{width:100%;min-height:92px;border:5px solid #282828;border-radius:24px;background:#ffca28;box-shadow:0 8px #a87600;font-size:clamp(36px,10vw,54px);font-weight:1000}
.spin:disabled{opacity:.32;box-shadow:none}.hint{color:#666}.book{margin-top:20px;padding:15px}.bookHead{display:flex;justify-content:space-between;align-items:center}
.book h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{position:relative;border:2px solid #333;border-radius:14px;background:#fff;overflow:hidden;min-height:135px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.card.lock img{filter:brightness(0);opacity:.14}.card.lock:after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:900;color:#999}
.cn{text-align:center;font-size:9px;font-weight:900;padding:3px}.card.lock .cn{visibility:hidden}.rar{position:absolute;top:4px;right:4px;background:#fff;border-radius:99px;padding:2px 5px;font-size:9px;font-weight:900;z-index:2}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.overlay.open{display:flex}.panel{width:min(420px,100%);background:#fffaf0;border:4px solid #282828;border-radius:24px;padding:20px}
.ph{display:flex;justify-content:space-between;align-items:center}.ph h2{margin:0}.close{width:44px;height:44px;border:3px solid #282828;border-radius:50%;background:#fff;font-size:25px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.add{min-height:74px;border:3px solid #282828;border-radius:18px;background:#a8e7a8;font-size:25px;font-weight:900}.add:nth-child(2){background:#cde6ff}
.reset{width:100%;margin-top:18px;min-height:48px;border:2px solid #922;border-radius:14px;background:#fff;color:#922;font-weight:800}
@media(min-width:540px){.grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><main class="app">
<header><h1>凱政ガラポン</h1><div class="top"><div class="pill">あと <b id="left">0</b> 回</div><button class="gear" id="gear">⚙️</button></div></header>
<section class="machine"><div class="hero" id="hero"><div class="q">?</div></div><div class="name" id="name">ガラポンしてみよう！</div><div class="meta" id="meta"></div><button class="spin" id="spin" disabled>ガラポン！</button><p class="hint">おうちの人に回数をもらってね</p></section>
<section class="book"><div class="bookHead"><h2>ずかん</h2><b><span id="ownedN">0</span> / 30</b></div><div class="grid" id="grid"></div></section></main>
<div class="overlay" id="parent"><div class="panel"><div class="ph"><h2>おうちの人メニュー</h2><button class="close" id="close">×</button></div><div class="actions"><button class="add" id="plus1">＋1回</button><button class="add" id="plus3">＋3回</button></div><button class="reset" id="reset">図鑑と回数をリセット</button></div></div>
<script>
const C=[{"id": 1, "name": "ホノイヌジャ", "element": "ほのお", "ee": "🔥", "job": "忍者", "je": "🥷", "animal": "いぬ", "ae": "🐶", "rarity": "N", "img": "01.jpg"}, {"id": 2, "name": "ミズネコポリス", "element": "みず", "ee": "💧", "job": "警察", "je": "👮", "animal": "ねこ", "ae": "🐱", "rarity": "N", "img": "02.jpg"}, {"id": 3, "name": "クサリュウジエイ", "element": "くさ", "ee": "🌿", "job": "自衛隊", "je": "🪖", "animal": "恐竜", "ae": "🦖", "rarity": "SR", "img": "03.jpg"}, {"id": 4, "name": "コオリペンショウ", "element": "こおり", "ee": "❄️", "job": "消防", "je": "🚒", "animal": "ペンギン", "ae": "🐧", "rarity": "R", "img": "04.jpg"}, {"id": 5, "name": "デンキウサレスキュ", "element": "でんき", "ee": "⚡", "job": "救助隊", "je": "⛑️", "animal": "うさぎ", "ae": "🐰", "rarity": "R", "img": "05.jpg"}, {"id": 6, "name": "ツチクマダイク", "element": "じめん", "ee": "🪨", "job": "大工", "je": "🔨", "animal": "くま", "ae": "🐻", "rarity": "N", "img": "06.jpg"}, {"id": 7, "name": "カゼトリヒコウ", "element": "かぜ", "ee": "🌪️", "job": "パイロット", "je": "✈️", "animal": "とり", "ae": "🐦", "rarity": "N", "img": "07.jpg"}, {"id": 8, "name": "ヒカリキツネイシャ", "element": "ひかり", "ee": "✨", "job": "お医者さん", "je": "🩺", "animal": "きつね", "ae": "🦊", "rarity": "R", "img": "08.jpg"}, {"id": 9, "name": "ヤミサメニンジャ", "element": "やみ", "ee": "🌑", "job": "忍者", "je": "🥷", "animal": "さめ", "ae": "🦈", "rarity": "R", "img": "09.jpg"}, {"id": 10, "name": "ホノオサルカラテ", "element": "ほのお", "ee": "🔥", "job": "空手家", "je": "🥋", "animal": "さる", "ae": "🐵", "rarity": "N", "img": "10.jpg"}, {"id": 11, "name": "ミズカメセンチョウ", "element": "みず", "ee": "💧", "job": "船長", "je": "⚓", "animal": "かめ", "ae": "🐢", "rarity": "N", "img": "11.jpg"}, {"id": 12, "name": "クサカエルノウカ", "element": "くさ", "ee": "🌿", "job": "農家", "je": "🚜", "animal": "かえる", "ae": "🐸", "rarity": "N", "img": "12.jpg"}, {"id": 13, "name": "コオリシロクマケイ", "element": "こおり", "ee": "❄️", "job": "警察", "je": "👮", "animal": "しろくま", "ae": "🐻‍❄️", "rarity": "R", "img": "13.jpg"}, {"id": 14, "name": "デンキライオンデン", "element": "でんき", "ee": "⚡", "job": "電気屋", "je": "🔧", "animal": "ライオン", "ae": "🦁", "rarity": "R", "img": "14.jpg"}, {"id": 15, "name": "ツチワニジエイ", "element": "じめん", "ee": "🪨", "job": "自衛隊", "je": "🪖", "animal": "わに", "ae": "🐊", "rarity": "N", "img": "15.jpg"}, {"id": 16, "name": "カゼネコハイタツ", "element": "かぜ", "ee": "🌪️", "job": "配達員", "je": "📦", "animal": "ねこ", "ae": "🐱", "rarity": "N", "img": "16.jpg"}, {"id": 17, "name": "ヒカリイヌエキイン", "element": "ひかり", "ee": "✨", "job": "駅員", "je": "🚉", "animal": "いぬ", "ae": "🐶", "rarity": "N", "img": "17.jpg"}, {"id": 18, "name": "ヤミフクロウタンテイ", "element": "やみ", "ee": "🌑", "job": "探偵", "je": "🔎", "animal": "ふくろう", "ae": "🦉", "rarity": "R", "img": "18.jpg"}, {"id": 19, "name": "ホノオトラショウボウ", "element": "ほのお", "ee": "🔥", "job": "消防", "je": "🚒", "animal": "とら", "ae": "🐯", "rarity": "R", "img": "19.jpg"}, {"id": 20, "name": "ミズイルカレスキュ", "element": "みず", "ee": "💧", "job": "救助隊", "je": "⛑️", "animal": "いるか", "ae": "🐬", "rarity": "R", "img": "20.jpg"}, {"id": 21, "name": "クサパンダコック", "element": "くさ", "ee": "🌿", "job": "コック", "je": "👨‍🍳", "animal": "パンダ", "ae": "🐼", "rarity": "N", "img": "21.jpg"}, {"id": 22, "name": "コオリキツネタンケン", "element": "こおり", "ee": "❄️", "job": "探検家", "je": "🧭", "animal": "きつね", "ae": "🦊", "rarity": "N", "img": "22.jpg"}, {"id": 23, "name": "デンキハムハカセ", "element": "でんき", "ee": "⚡", "job": "博士", "je": "🥼", "animal": "ハムスター", "ae": "🐹", "rarity": "SR", "img": "23.jpg"}, {"id": 24, "name": "ツチゴリラコウジ", "element": "じめん", "ee": "🪨", "job": "工事隊", "je": "🚧", "animal": "ゴリラ", "ae": "🦍", "rarity": "N", "img": "24.jpg"}, {"id": 25, "name": "カゼウマケイサツ", "element": "かぜ", "ee": "🌪️", "job": "警察", "je": "👮", "animal": "うま", "ae": "🐴", "rarity": "N", "img": "25.jpg"}, {"id": 26, "name": "ヒカリヒツジホイク", "element": "ひかり", "ee": "✨", "job": "先生", "je": "📚", "animal": "ひつじ", "ae": "🐑", "rarity": "N", "img": "26.jpg"}, {"id": 27, "name": "ヤミコウモリスパイ", "element": "やみ", "ee": "🌑", "job": "スパイ", "je": "🕶️", "animal": "こうもり", "ae": "🦇", "rarity": "SR", "img": "27.jpg"}, {"id": 28, "name": "ホノオブタコック", "element": "ほのお", "ee": "🔥", "job": "コック", "je": "👨‍🍳", "animal": "ぶた", "ae": "🐷", "rarity": "N", "img": "28.jpg"}, {"id": 29, "name": "ミズタコセンチョウ", "element": "みず", "ee": "💧", "job": "船長", "je": "⚓", "animal": "たこ", "ae": "🐙", "rarity": "R", "img": "29.jpg"}, {"id": 30, "name": "クサリスユウビン", "element": "くさ", "ee": "🌿", "job": "郵便屋", "je": "📮", "animal": "りす", "ae": "🐿️", "rarity": "N", "img": "30.jpg"}],KEY="kaisei-garapon-kimokawa-v1";let S={spins:0,owned:[]},busy=false;
const $=x=>document.getElementById(x);try{let z=JSON.parse(localStorage.getItem(KEY));if(z&&Array.isArray(z.owned))S={spins:+z.spins||0,owned:z.owned}}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function render(){ $("left").textContent=S.spins;$("ownedN").textContent=S.owned.length;$("spin").disabled=S.spins<1||busy;
$("grid").innerHTML=C.map(c=>`<div class="card ${S.owned.includes(c.id)?"":"lock"}"><span class="rar">${c.rarity}</span><img src="${c.img}" alt=""><div class="cn">${c.name}</div></div>`).join("")}
function pick(){let r=Math.random(),rar=r<.70?"N":r<.95?"R":"SR",p=C.filter(x=>x.rarity===rar);return p[Math.floor(Math.random()*p.length)]}
function show(c,isNew){$("hero").innerHTML=`<img src="${c.img}" alt="${c.name}">`;$("name").textContent=c.name;$("meta").innerHTML=`<span class=tag>${c.ee} ${c.element}</span><span class=tag>${c.je} ${c.job}</span><span class=tag>${c.ae} ${c.animal}</span><span class=tag>${c.rarity}</span>${isNew?"<span class='tag new'>NEW!</span>":""}`}
$("gear").onclick=()=>$("parent").classList.add("open");$("close").onclick=()=>$("parent").classList.remove("open");
function add(n){S.spins=Math.min(99,S.spins+n);save();render();$("parent").classList.remove("open")}$("plus1").onclick=()=>add(1);$("plus3").onclick=()=>add(3);
$("parent").onclick=e=>{if(e.target===$("parent"))$("parent").classList.remove("open")};
$("reset").onclick=()=>{if(confirm("図鑑と回数を全部リセットしますか？")){S={spins:0,owned:[]};save();render();$("hero").innerHTML='<div class=q>?</div>';$("name").textContent="ガラポンしてみよう！";$("meta").innerHTML="";$("parent").classList.remove("open")}};
$("spin").onclick=()=>{if(busy||S.spins<1)return;busy=true;S.spins--;save();render();$("name").textContent="ガラガラガラ…";setTimeout(()=>{let c=pick(),nw=!S.owned.includes(c.id);if(nw)S.owned.push(c.id);busy=false;save();show(c,nw);render()},850)};
render();window.__GARAPON__={state:()=>S,add,pick};
</script></body></html>
