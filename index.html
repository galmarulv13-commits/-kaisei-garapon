name": "ケロケロシェフ", "element": "みず", "elementEmoji": "💧", "job": "自衛隊", "jobEmoji": "🪖", "attack": 2110, "defense": 1953, "rarity": "N", "img": "09.jpg", "description": "大きなフライパンを持った、料理好きのカエルコビト。おいしいにおいがすると、どこからともなく現れる。"}, {"id": 10, "kana": "コ", "name": "コオリノマホウツカイ", "element": "くさ", "elementEmoji": "🌿", "job": "警察", "jobEmoji": "👮", "attack": 2771, "defense": 2907, "rarity": "N", "img": "10.jpg", "description": "冷たい風をあやつる、青い帽子のまほうつかい。暑い日は人気者だけど、くしゃみをすると雪が降る。"}, {"id": 11, "kana": "サ", "name": "サムライサソリ", "element": "くさ", "elementEmoji": "🌿", "job": "消防士", "jobEmoji": "🚒", "attack": 7738, "defense": 8384, "rarity": "R", "img": "11.jpg", "description": "大きなしっぽを武器にする、礼儀正しいサソリの侍。戦う前には必ず深くおじぎをする。"}, {"id": 12, "kana": "シ", "name": "シロクマレスキュー", "element": "ひかり", "elementEmoji": "✨", "job": "博士", "jobEmoji": "🥼", "attack": 6449, "defense": 5298, "rarity": "N", "img": "12.jpg", "description": "雪山で困った人を探す、力持ちのシロクマコビト。寒い場所ほど元気になり、重い荷物も軽々運ぶ。"}, {"id": 13, "kana": "ス", "name": "スイカノブシ", "element": "こおり", "elementEmoji": "❄️", "job": "パイロット", "jobEmoji": "✈️", "attack": 8833, "defense": 4845, "rarity": "R", "img": "13.jpg", "description": "スイカのようにみずみずしくたくましい旅人コビト。どこへでも旅して、おいしいスイカを探すのが大好き。"}, {"id": 14, "kana": "セ", "name": "セミノミハリバン", "element": "かぜ", "elementEmoji": "🌪️", "job": "大工", "jobEmoji": "🔨", "attack": 2617, "defense": 1614, "rarity": "N", "img": "14.jpg", "description": "木の上から町を見張る、声の大きなセミコビト。あやしいものを見つけると、ものすごい声で知らせる。"}, {"id": 15, "kana": "ソ", "name": "ソウジキモグラ", "element": "でんき", "elementEmoji": "⚡", "job": "パイロット", "jobEmoji": "✈️", "attack": 8218, "defense": 9972, "rarity": "SR", "img": "15.jpg", "description": "土の中を進みながら、落とし物を集めるモグラコビト。通ったあとは不思議なくらいきれいになる。"}, {"id": 16, "kana": "タ", "name": "タコヤキゾウ", "element": "じめん", "elementEmoji": "🪨", "job": "自衛隊", "jobEmoji": "🪖", "attack": 6130, "defense": 4134, "rarity": "N", "img": "16.jpg", "description": "丸いおなかでタコヤキを守る、のんびりしたゾウコビト。熱々のタコヤキを鼻で上手に冷ましてくれる。"}, {"id": 17, "kana": "チ", "name": "チョウチョケイサツ", "element": "じめん", "ele
