<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7dc" />
  <title>凱政ガラポン</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>凱政ガラポン</h1>
      <div class="status-row">
        <div class="ticket">あと <strong id="spinsLeft">0</strong> 回</div>
        <button id="parentToggle" class="small-btn" aria-label="おうちの人メニュー">⚙️</button>
      </div>
    </header>

    <section class="machine" aria-live="polite">
      <div id="ball" class="ball">?</div>
      <div id="result" class="result">ガラポンしてみよう！</div>
      <button id="spinBtn" class="spin-btn" disabled>ガラポン！</button>
      <div id="needTicket" class="hint">おうちの人に回数をもらってね</div>
    </section>

    <section class="collection">
      <div class="collection-head">
        <h2>ずかん</h2>
        <div><strong id="ownedCount">0</strong> / 26</div>
      </div>
      <div id="collectionGrid" class="grid"></div>
    </section>

    <section id="parentPanel" class="parent-panel hidden">
      <h2>おうちの人メニュー</h2>
      <div class="parent-actions">
        <button id="addOne" class="parent-btn">ガラポン ＋1</button>
        <button id="addThree" class="parent-btn secondary">＋3</button>
      </div>
      <button id="resetBtn" class="text-btn">データをリセット</button>
      <p class="parent-note">※ この端末のブラウザに記録されます。</p>
    </section>
  </main>

  <dialog id="resetDialog">
    <form method="dialog" class="dialog-card">
      <h3>ほんとうにリセット？</h3>
      <p>回数と図鑑が全部消えます。</p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-btn">やめる</button>
        <button id="confirmReset" value="default" class="danger-btn">リセットする</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
